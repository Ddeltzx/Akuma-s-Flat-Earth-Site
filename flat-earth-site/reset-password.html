<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password</title>
  <link rel="stylesheet" href="styles.css">
  <script>
    window.API_BASE_URL = 'http://127.0.0.1:3000';
  </script>
</head>
<body>
  <header>
    <img src="assets/logo.png" alt="Site Logo" class="logo glitch">
    <h1 class="classified-title">PASSWORD RESET</h1>
    <p class="classified-subtitle">Recover Access</p>
    <nav class="archive-nav">
      <a href="index.html">HOME</a>
      <a href="account.html">ACCOUNT</a>
    </nav>
  </header>

  <section class="hero">
    <div class="content-box" style="max-width: 720px;">
      <h3 style="margin-top:0; color:#0aff0a; text-transform:uppercase;">Request or Complete a Reset</h3>
      <form id="requestResetForm">
        <label style="display:block; margin-bottom:8px;">Email<br><input type="email" name="email" required style="width:100%; padding:8px; margin-top:4px;"></label>
        <button type="submit" class="game-button">Request Reset</button>
      </form>
      <div id="requestResetMessage" class="archive-note" style="margin-top:10px;"></div>
      <form id="completeResetForm" style="margin-top:20px;">
        <label style="display:block; margin-bottom:8px;">Reset Token<br><input type="text" name="token" required style="width:100%; padding:8px; margin-top:4px;"></label>
        <label style="display:block; margin-bottom:8px;">New Password<br><input type="password" name="password" required style="width:100%; padding:8px; margin-top:4px;"></label>
        <label style="display:block; margin-bottom:12px;">Confirm Password<br><input type="password" name="confirmPassword" required style="width:100%; padding:8px; margin-top:4px;"></label>
        <button type="submit" class="game-button">Set New Password</button>
      </form>
      <div id="completeResetMessage" class="archive-note" style="margin-top:10px;"></div>
    </div>
  </section>

  <footer>
    <p>© 2026 Flat Earth Intelligence Archive — All Rights Reserved</p>
  </footer>

  <script>
    const requestResetForm = document.getElementById('requestResetForm');
    const completeResetForm = document.getElementById('completeResetForm');
    const requestResetMessage = document.getElementById('requestResetMessage');
    const completeResetMessage = document.getElementById('completeResetMessage');

    const API_BASE_URL = window.API_BASE_URL || '/';

    async function fetchJson(url, options = {}) {
      const response = await fetch(`${API_BASE_URL}${url.replace(/^\//, '')}`, {
        headers: { 'Content-Type': 'application/json' },
        ...options
      });
      const payload = await response.json();
      if (!response.ok) {
        throw new Error(payload.message || 'Request failed.');
      }
      return payload;
    }

    requestResetForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      requestResetMessage.textContent = 'Preparing reset link...';
      try {
        const formData = new FormData(requestResetForm);
        const payload = await fetchJson('/api/request-reset', {
          method: 'POST',
          body: JSON.stringify({ email: formData.get('email') })
        });
        requestResetMessage.textContent = payload.message;
        if (payload.resetLink) {
          requestResetMessage.innerHTML = `${payload.message}<br><a href="${payload.resetLink}">${payload.resetLink}</a>`;
        }
      } catch (error) {
        requestResetMessage.textContent = error.message;
      }
    });

    completeResetForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      completeResetMessage.textContent = 'Updating password...';
      try {
        const formData = new FormData(completeResetForm);
        const payload = await fetchJson('/api/reset-password', {
          method: 'POST',
          body: JSON.stringify({
            token: formData.get('token'),
            password: formData.get('password'),
            confirmPassword: formData.get('confirmPassword')
          })
        });
        completeResetMessage.textContent = payload.message;
      } catch (error) {
        completeResetMessage.textContent = error.message;
      }
    });
  </script>
</body>
</html>
